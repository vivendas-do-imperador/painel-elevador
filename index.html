<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Painel — Vivendas do Imperador</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --az0:#060e18;--az1:#0d1b2a;--az2:#142238;
  --ou:#c9a84c;--oul:#e8c96a;--br:#f0ead8;--vm:#8b1a1a;
}
html,body{width:100vw;height:100vh;overflow:hidden;margin:0;padding:0;background:#000;font-family:'Inter',sans-serif;color:var(--br)}
#scale-wrap{width:1920px;height:1080px;transform-origin:top left;position:absolute;top:0;left:0;background:linear-gradient(160deg,#060e18 0%,#0d1b2a 50%,#111f30 100%)}

/* HEADER */
#header{height:130px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;background:linear-gradient(90deg,#040a10 0%,#0a1828 50%,#040a10 100%);border-bottom:2px solid var(--ou);position:relative;z-index:10;flex-shrink:0}
#logo-wrap img{height:108px}
#header-center{position:absolute;left:50%;transform:translateX(-50%);text-align:center}
#header-center h1{font-family:'Playfair Display',serif;font-size:40px;font-weight:700;color:var(--oul);letter-spacing:5px;text-transform:uppercase}
#header-center .sub{font-size:13px;color:rgba(240,234,216,0.4);letter-spacing:4px;text-transform:uppercase;margin-top:5px}
#relogio-wrap{text-align:right}
#hora{font-family:'Playfair Display',serif;font-size:60px;color:var(--oul);line-height:1;letter-spacing:2px}
#data{font-size:15px;color:rgba(240,234,216,0.5);margin-top:5px;text-transform:capitalize}

/* CORPO */
#corpo{display:flex;height:calc(1080px - 130px - 68px)}

/* ESQUERDA */
#painel-esq{width:900px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid rgba(201,168,76,0.25);position:relative;overflow:hidden}
#aviso-area{flex:1;display:flex;flex-direction:column;justify-content:center;padding:50px 60px;position:relative}
#aviso-area::before{content:'';position:absolute;top:0;left:40px;right:40px;height:2px;background:linear-gradient(90deg,transparent,var(--ou),transparent)}
#aviso-icone{font-size:80px;margin-bottom:16px;line-height:1}
#aviso-tag{font-size:22px;font-weight:600;letter-spacing:5px;text-transform:uppercase;color:var(--ou);display:flex;align-items:center;gap:10px;margin-bottom:22px}
#aviso-tag::before{content:'';width:24px;height:1px;background:var(--ou)}
#aviso-titulo{font-family:'Playfair Display',serif;font-size:72px;font-weight:700;line-height:1.1;color:var(--br);margin-bottom:22px}
#aviso-texto{font-size:34px;line-height:1.65;color:rgba(240,234,216,0.8);font-weight:300;white-space:pre-line}
#aviso-ornamento{position:absolute;right:40px;bottom:30px;font-family:'Playfair Display',serif;font-size:200px;opacity:0.03;color:var(--ou);line-height:1;user-select:none}
#progresso-aviso{height:3px;width:0%;background:linear-gradient(90deg,var(--ou),var(--oul));box-shadow:0 0 6px var(--ou);transition:width linear;flex-shrink:0}

/* DIREITA */
#painel-dir{flex:1;display:flex;flex-direction:column}
#clima-box{padding:32px 44px 28px;border-bottom:1px solid rgba(201,168,76,0.2);background:rgba(0,0,0,0.15)}
#clima-tag{font-size:18px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--ou);margin-bottom:14px}
#clima-main{display:flex;align-items:center;gap:20px}
#clima-icone{font-size:72px;line-height:1}
#clima-temp{font-family:'Playfair Display',serif;font-size:96px;color:var(--oul);line-height:1}
#clima-temp sup{font-size:38px;vertical-align:top;margin-top:14px}
#clima-info{margin-left:8px}
#clima-info h3{font-family:'Playfair Display',serif;font-size:32px;color:var(--br)}
#clima-info p{font-size:20px;color:rgba(240,234,216,0.55);margin-top:6px}
#frase-box{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px 44px;border-bottom:1px solid rgba(201,168,76,0.2);position:relative;overflow:hidden}
#frase-aspas{font-family:'Playfair Display',serif;font-size:110px;color:var(--ou);line-height:0.5;display:block;margin-bottom:10px;opacity:0.5}
#frase-texto{font-family:'Playfair Display',serif;font-size:32px;font-style:italic;line-height:1.5;color:var(--br)}
#frase-autor{font-size:16px;color:var(--ou);letter-spacing:3px;text-transform:uppercase;margin-top:16px}

/* TICKER */
#ticker-bar{height:68px;flex-shrink:0;z-index:10;display:flex;align-items:center;overflow:hidden;background:linear-gradient(90deg,#040a10 0%,#0a1828 50%,#040a10 100%);border-top:2px solid var(--ou)}
#ticker-label{flex-shrink:0;height:100%;padding:0 36px;display:flex;align-items:center;background:var(--ou);font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--az0);white-space:nowrap;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);padding-right:36px}
#ticker-scroll-wrap{flex:1;overflow:hidden;height:100%}
#ticker-content{display:flex;align-items:center;height:100%;white-space:nowrap;animation:ticker 80s linear infinite}
#ticker-content span{font-size:24px;color:rgba(240,234,216,0.85);padding:0 52px;font-weight:300}
#ticker-content span::after{content:' ✶ ';color:var(--ou);opacity:0.7}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* VIDEO */
#video-overlay{display:none;position:absolute;top:130px;left:0;width:900px;bottom:68px;z-index:50;background:#000}
#video-overlay video{width:100%;height:100%;object-fit:contain}
#video-fechar{position:absolute;top:12px;right:12px;background:rgba(201,168,76,0.8);border:none;color:#000;font-size:20px;font-weight:700;width:40px;height:40px;border-radius:50%;cursor:pointer;z-index:51}

/* LOADING */
#loading{position:fixed;inset:0;z-index:999;background:var(--az0);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s ease}
#loading img{height:160px;margin-bottom:40px}
#loading p{font-size:14px;color:var(--ou);letter-spacing:5px;text-transform:uppercase}
.spinner{width:44px;height:44px;margin-top:32px;border:2px solid rgba(201,168,76,0.15);border-top-color:var(--ou);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<script>
const BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQFwDv-j2gAwxBG_By050kTjvLpU4A72Cpqs6Cr8AqQ_8zuP_F1hxXYwrN-17l9gg/pub';
const CSV = {
  AVISOS:   BASE+'?gid=559020146&single=true&output=csv',
  REGRAS:   BASE+'?gid=1562663348&single=true&output=csv',
  FRASES:   BASE+'?gid=1324066738&single=true&output=csv',
  TICKER:   BASE+'?gid=1951218522&single=true&output=csv',
  CONTROLE: BASE+'?gid=1285560480&single=true&output=csv',
};
const CFG = {
  TEMPO_AVISO:12000, TEMPO_FRASE:10000,
  CLIMA_LAT:-22.9039, CLIMA_LON:-43.4205, CLIMA_INT:600000,
  MIDIAS:[
    // './videos/video1.mp4',
  ],
};

function ajustarEscala(){
  const w=document.getElementById('scale-wrap');
  const sx=window.innerWidth/1920, sy=window.innerHeight/1080;
  const s=Math.max(sx,sy);
  const ox=(window.innerWidth-1920*s)/2, oy=(window.innerHeight-1080*s)/2;
  w.style.transform='translate('+ox+'px,'+oy+'px) scale('+s+')';
}
ajustarEscala(); window.addEventListener('resize',ajustarEscala);

const DIAS=['Domingo','Segunda-Feira','Terça-Feira','Quarta-Feira','Quinta-Feira','Sexta-Feira','Sábado'];
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function tick(){
  const n=new Date();
  document.getElementById('hora').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  document.getElementById('data').textContent=DIAS[n.getDay()]+', '+n.getDate()+' de '+MESES[n.getMonth()]+' de '+n.getFullYear();
}

async function fetchCSV(url){
  try{
    const r=await fetch(url+'&t='+Date.now());
    const txt=await r.text();
    return txt.trim().split('\n').map(l=>{
      const cols=[];let cur='';let inQ=false;
      for(let i=0;i<l.length;i++){
        const c=l[i];
        if(c==='"'){inQ=!inQ;}
        else if(c===','&&!inQ){cols.push(cur.trim());cur='';}
        else{cur+=c;}
      }
      cols.push(cur.trim()); return cols;
    }).slice(3);
  }catch(e){return[];}
}

const WMO_IC={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',80:'🌦️',81:'🌦️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
const WMO_DC={0:'Céu limpo',1:'Predominantemente limpo',2:'Parcialmente nublado',3:'Nublado',45:'Nevoeiro',48:'Nevoeiro',51:'Garoa fraca',53:'Garoa moderada',55:'Garoa densa',61:'Chuva fraca',63:'Chuva moderada',65:'Chuva forte',80:'Pancadas fracas',81:'Pancadas moderadas',82:'Pancadas fortes',95:'Trovoadas',96:'Trovoadas',99:'Trovoadas'};

async function fetchClima(){
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+CFG.CLIMA_LAT+'&longitude='+CFG.CLIMA_LON+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,weathercode,windspeed_10m&timezone=America%2FSao_Paulo');
    const d=await r.json(); const c=d.current;
    document.getElementById('clima-icone').textContent=WMO_IC[c.weathercode]||'🌡️';
    document.getElementById('clima-temp').innerHTML=Math.round(c.temperature_2m)+'<sup>°C</sup>';
    document.getElementById('clima-desc').textContent=WMO_DC[c.weathercode]||'Variável';
    document.getElementById('clima-detalhes').textContent='Sensação '+Math.round(c.apparent_temperature)+'°C  ·  Umidade '+c.relative_humidity_2m+'%  ·  Vento '+Math.round(c.windspeed_10m)+' km/h';
  }catch(e){}
}

let avisos=[],avisoIdx=0,avisoTimer=null;

function mostrarAviso(item){
  if(item.midia){tocarVideo(item.midia);proximoAvisoComDelay(CFG.TEMPO_AVISO*2);return;}
  document.getElementById('aviso-icone').textContent=item.icone||'📢';
  document.getElementById('aviso-tag').textContent=item.tag||'Aviso do Condomínio';
  document.getElementById('aviso-titulo').textContent=item.titulo;
  document.getElementById('aviso-texto').textContent=item.texto;
  const b=document.getElementById('progresso-aviso');
  b.style.transition='none';b.style.width='0%';
  clearTimeout(avisoTimer);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    b.style.transition='width '+CFG.TEMPO_AVISO+'ms linear';b.style.width='100%';
  }));
  avisoTimer=setTimeout(proximoAviso,CFG.TEMPO_AVISO);
}

function proximoAvisoComDelay(d){clearTimeout(avisoTimer);avisoTimer=setTimeout(proximoAviso,d);}
function proximoAviso(){if(!avisos.length)return;avisoIdx=(avisoIdx+1)%avisos.length;mostrarAviso(avisos[avisoIdx]);}

const AVISOS_EX=[
  {titulo:'Bem-vindo ao Painel',texto:'As informações do condomínio serão exibidas aqui em breve.',icone:'👋',tag:'Aviso do Condomínio'},
  {titulo:'Horário de Silêncio',texto:'Das 22h às 08h pedimos silêncio total. Respeite os vizinhos.',icone:'🌙',tag:'Normas de Convivência'},
];
const FRASES_EX=[
  {frase:'A comunidade é onde a solidariedade se transforma em vizinhança.',autor:''},
  {frase:'Um lar não é apenas um lugar; é um sentimento de pertencimento.',autor:''},
];
const TICKER_EX=['Portaria: atendimento 24 horas','Administração: seg a sex, das 09h às 18h','Em caso de emergência: ligue para a portaria'];

async function carregarAvisos(){
  const a=await fetchCSV(CSV.AVISOS);
  const r=await fetchCSV(CSV.REGRAS);
  const lista=[];
  if(a.length) a.filter(x=>x[0]&&x[3]!=='NÃO'&&!x[0].startsWith('⚙️')).forEach(x=>lista.push({titulo:x[0],texto:x[1]||'',icone:x[2]||'📢',tag:'Aviso do Condomínio'}));
  if(r.length) r.filter(x=>x[0]&&x[3]!=='NÃO'&&!x[0].startsWith('⚙️')).forEach(x=>lista.push({titulo:x[0],texto:x[1]||'',icone:x[2]||'📜',tag:'Normas de Convivência'}));
  if(!lista.length) AVISOS_EX.forEach(x=>lista.push(x));
  lista.push({titulo:'ELS Grid',texto:'Tecnologia  ·  Informes  ·  Produções\n\n💬  (21) 97269-0650  — Somente mensagens\n✉️  elsgrid@gmail.com',icone:'🏢',tag:'Desenvolvedor deste Painel'});
  CFG.MIDIAS.forEach(url=>lista.push({midia:url}));
  avisos=lista;
  if(avisos.length)mostrarAviso(avisos[0]);
}

let frases=[],fraseIdx=0;
function mostrarFrase(f){document.getElementById('frase-texto').textContent=f.frase;document.getElementById('frase-autor').textContent=f.autor||'';}
function proximaFrase(){if(!frases.length)return;fraseIdx=(fraseIdx+1)%frases.length;mostrarFrase(frases[fraseIdx]);}

async function carregarFrases(){
  const rows=await fetchCSV(CSV.FRASES);
  const lista=rows.filter(x=>x[0]&&x[2]!=='NÃO').map(x=>({frase:x[0],autor:x[1]||''}));
  frases=lista.length?lista:FRASES_EX;
  if(frases.length)mostrarFrase(frases[0]);
  setInterval(proximaFrase,CFG.TEMPO_FRASE);
}

async function carregarTicker(){
  const rows=await fetchCSV(CSV.TICKER);
  const lista=rows.filter(x=>x[0]&&x[1]!=='NÃO').map(x=>x[0]);
  const itens=lista.length?lista:TICKER_EX;
  const dup=[...itens,...itens];
  document.getElementById('ticker-content').innerHTML=dup.map(t=>'<span>'+t+'</span>').join('');
}

function tocarVideo(url){
  const ov=document.getElementById('video-overlay');
  const vp=document.getElementById('video-player');
  vp.src=url; vp.muted=false;
  ov.style.display='block';
  vp.play().catch(()=>{vp.muted=true;vp.play();});
  vp.onended=fecharVideo;
}
function fecharVideo(){
  const ov=document.getElementById('video-overlay');
  const vp=document.getElementById('video-player');
  vp.pause();vp.src='';ov.style.display='none';
  proximoAviso();
}

async function verificarControle(){
  const rows=await fetchCSV(CSV.CONTROLE);
  if(!rows||!rows[0])return;
  const cmd=(rows[0][0]||'').trim().toLowerCase();
  const val=(rows[0][1]||'').trim();
  if(cmd==='video'&&val)tocarVideo(val);
}

async function init(){
  tick(); setInterval(tick,10000);
  await fetchClima(); setInterval(fetchClima,CFG.CLIMA_INT);
  await carregarAvisos();
  await carregarFrases();
  await carregarTicker();
  setInterval(verificarControle,30000);
  setInterval(carregarAvisos,300000);
  const ld=document.getElementById('loading');
  ld.style.opacity='0';
  setTimeout(()=>ld.style.display='none',1000);
}

// Fallback: se loading ainda visível após 8s, força saída
setTimeout(()=>{
  const ld=document.getElementById('loading');
  if(ld){ld.style.opacity='0';setTimeout(()=>{ld.style.display='none';},500);}
},8000);

// Iniciar assim que possível
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
<\/script>
