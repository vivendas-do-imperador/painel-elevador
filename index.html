<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Vivendas do Imperador</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--az0:#060e18;--az1:#0d1b2a;--az2:#142238;--ou:#c9a84c;--oul:#e8c96a;--br:#f0ead8;--muted:rgba(240,234,216,0.4);--verde:#2ecc71;--vermelho:#e74c3c;}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--az1);color:var(--br);font-family:'Inter',sans-serif;}
#painel{width:100vw;height:100vh;display:flex;flex-direction:column;}

/* HEADER */
#header{height:12vh;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;background:var(--az0);border-bottom:2px solid var(--ou);position:relative;flex-shrink:0;}
#logo-wrap img{height:8vh;object-fit:contain;}
#header-center{position:absolute;left:50%;transform:translateX(-50%);text-align:center;}
#header-center h1{font-family:'Playfair Display',serif;font-size:3vw;font-weight:900;color:var(--ou);letter-spacing:0.3vw;text-transform:uppercase;white-space:nowrap;}
#header-center small{display:block;font-size:1.2vw;color:rgba(255,255,255,0.75);letter-spacing:0.2vw;margin-top:0.2vh;}
#relogio-wrap{text-align:right;position:relative;}
#relogio{font-family:'Playfair Display',serif;font-size:4.2vw;font-weight:900;color:var(--ou);line-height:1;}
#data-label{font-size:1.2vw;color:rgba(255,255,255,0.8);margin-top:0.2vh;white-space:nowrap;}
#lua-label{font-size:1.0vw;color:rgba(255,255,255,0.9);margin-top:0.1vh;font-family:'Playfair Display',serif;font-weight:600;letter-spacing:0.05vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:18vw;position:absolute;bottom:-1.8vh;right:0;background:rgba(0,0,0,0.5);padding:0 0.6vw;border-radius:3px;}

/* CORPO */
#corpo{display:flex;flex:1;overflow:hidden;}
#painel-esq{width:50vw;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.1);position:relative;overflow:hidden;}
#aviso-area{flex:1;padding:3vh 4vw;display:flex;flex-direction:column;justify-content:center;position:relative;}
#aviso-area::before{content:'';position:absolute;top:0;left:3vw;right:3vw;height:2px;background:linear-gradient(90deg,transparent,var(--ou),transparent);}
#aviso-icone{font-size:5vh;margin-bottom:1vh;line-height:1}
#aviso-tag{font-family:'Playfair Display',serif;font-size:1.6vw;font-weight:700;letter-spacing:0.4vw;text-transform:uppercase;color:var(--ou);margin-bottom:1.2vh;display:flex;align-items:center;gap:0.8vw;}
#aviso-tag::before{content:'';width:1.5vw;height:2px;background:var(--ou);}
#aviso-titulo{font-family:'Playfair Display',serif;font-size:6vw;font-weight:900;line-height:1.05;color:#fff;margin-bottom:1.2vh;}
#aviso-texto{font-size:1.9vw;line-height:1.6;color:rgba(255,255,255,.85);font-weight:300;white-space:pre-line;}
#progresso-aviso{height:4px;width:0%;background:var(--ou);box-shadow:0 0 8px var(--ou);transition:width linear;flex-shrink:0;}
#feriado-badge{display:none;position:absolute;top:1vh;right:1.5vw;background:rgba(240,165,0,0.15);border:1px solid var(--ou);border-radius:6px;padding:0.4vh 1vw;font-family:'Playfair Display',serif;font-size:1.1vw;color:var(--ou);font-weight:700;letter-spacing:0.1vw;z-index:5;}
#player-video-wrap{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:100;background:#000;}
#player-video-wrap video{width:100%;height:100%;object-fit:contain;}
.btn-fechar-video{position:fixed;top:2vh;right:2vw;background:rgba(201,168,76,0.9);border:none;color:#000;border-radius:50%;width:5vh;height:5vh;cursor:pointer;font-size:2.5vh;z-index:101;font-weight:bold;}
#painel-dir{flex:1;display:flex;flex-direction:column;background:var(--az1);overflow:hidden;}
#clima-box{padding:1.5vh 2vw;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.15);flex-shrink:0;}
#clima-tag{font-family:'Playfair Display',serif;font-size:1vw;font-weight:700;letter-spacing:0.3vw;text-transform:uppercase;color:var(--ou);margin-bottom:0.8vh;}
#clima-main{display:flex;align-items:center;gap:1.2vw;}
#clima-icone{font-size:4vh;line-height:1;}
#clima-temp{font-family:'Playfair Display',serif;font-size:5vh;font-weight:900;color:var(--ou);line-height:1;}
#clima-temp sup{font-size:2.2vh;vertical-align:top;margin-top:0.4vh;}
#clima-info h3{font-family:'Playfair Display',serif;font-size:2.2vh;color:#fff;margin-bottom:0.2vh;}
#clima-info p{font-size:1.6vh;color:rgba(255,255,255,0.8);}
#mercado-box{padding:1.2vh 2vw;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.12);flex-shrink:0;}
#mercado-tag{font-family:'Playfair Display',serif;font-size:1vw;font-weight:700;letter-spacing:0.3vw;text-transform:uppercase;color:var(--ou);margin-bottom:0.8vh;}
#mercado-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0.6vw;}
.mercado-item{background:rgba(255,255,255,.04);border:1px solid rgba(240,165,0,0.2);border-radius:5px;padding:0.8vh 0.5vw;text-align:center;}
.mercado-nome{font-family:'Playfair Display',serif;font-size:0.85vw;font-weight:700;letter-spacing:0.1vw;text-transform:uppercase;color:var(--ou);margin-bottom:0.2vh;}
.mercado-valor{font-family:'Arial',sans-serif;font-size:2.4vh;font-weight:900;color:#fff;line-height:1.1;}
.mercado-var{font-family:'Playfair Display',serif;font-size:1.2vh;font-weight:700;margin-top:0.2vh;}
.mercado-var.up{color:var(--verde);}
.mercado-var.down{color:var(--vermelho);}
.mercado-var.neu{color:var(--muted);}
#noticias-box{flex:1;padding:1.8vh 1.5vw 1vh;background:rgba(0,0,0,0.12);display:flex;flex-direction:column;position:relative;overflow:hidden;border-bottom:1px solid rgba(201,168,76,0.2);}
#noticias-box::before{content:'';position:absolute;top:0;left:1vw;right:1vw;height:1px;background:linear-gradient(90deg,transparent,var(--ou),transparent);}
#noticias-tag{font-family:'Playfair Display',serif;font-size:1vw;font-weight:700;letter-spacing:0.35vw;text-transform:uppercase;color:var(--ou);margin-bottom:0.6vh;display:flex;align-items:center;gap:0.5vw;}
#noticias-lista-multi{flex:1;display:flex;flex-direction:column;gap:0.6vh;overflow:hidden;}
.n-item{display:flex;align-items:center;gap:1.2vw;padding:0.6vh 1.2vw;background:rgba(255,255,255,0.04);border:1px solid rgba(201,168,76,0.18);border-radius:6px;flex:1;overflow:hidden;min-height:0;}
.n-logo{flex-shrink:0;width:5.5vw;height:3.5vh;object-fit:contain;border-radius:3px;}
.n-titulo{font-family:'Arial',sans-serif;font-size:1.1vw;color:var(--br);line-height:1.25;font-weight:700;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
#noticias-progresso{height:2px;width:0%;background:linear-gradient(90deg,var(--ou),var(--oul,#e8c96a));box-shadow:0 0 6px var(--ou);transition:width linear;flex-shrink:0;margin-top:0.6vh;}
#frase-box{flex:1;padding:1.5vh 2.5vw;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);overflow:hidden;}
.frase-icone{font-size:3vh;margin-bottom:1vh;opacity:.7;}
#frase-texto{font-family:'Playfair Display',serif;font-size:1.6vw;font-weight:600;line-height:1.4;color:#f0ead8;font-style:italic;}
#frase-autor{margin-top:0.8vh;font-size:1.0vw;color:var(--muted);}
#ticker-bar{height:5.5vh;flex-shrink:0;display:flex;align-items:center;overflow:hidden;background:var(--az0);border-top:2px solid var(--ou);}
#reload-status{position:fixed;bottom:6vh;right:0.5vw;font-size:0.7vw;color:rgba(255,193,7,0.4);font-family:'Playfair Display',serif;z-index:999;text-align:right;pointer-events:none;transition:color 1s}
#ticker-label{background:var(--ou);color:var(--az0);font-family:'Playfair Display',serif;font-weight:900;font-size:1.6vw;padding:0 1.8vw;height:100%;display:flex;align-items:center;white-space:nowrap;flex-shrink:0;clip-path:polygon(0 0,calc(100% - 1vw) 0,100% 50%,calc(100% - 1vw) 100%,0 100%);padding-right:2.2vw;}
#ticker-scroll{flex:1;overflow:hidden;height:100%;}
#ticker-text{white-space:nowrap;font-size:1.8vw;font-weight:500;color:#fff;animation:ticker 60s linear infinite;display:inline-block;padding-left:100%;}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
#fk-status{position:fixed;top:4px;right:8px;font-size:10px;color:rgba(255,255,255,.4);z-index:200;}
</style>
</head>

<script>
// ==================== CONFIGURAÇÃO ====================
const CSV_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7LIajehR7ILfrKuQvQBuwIT7c70FbSrm0FSJ9CXRiSlnawZJzSdCd73QpYpVWeuBDfIVFRNNvDqKN/pub'; // ← Troque pelo seu link se diferente

const GID_AVISOS = '1009110074';
const GID_TICKER = '798329129';
const GID_FRASES = '438009640';
const GID_CONTROLE = '1273927625';

// Função para buscar dados da planilha
async function fetchCSV(gid) {
  try {
    const url = `${CSV_BASE}?gid=${gid}&output=csv`;
    const r = await fetch(url, {cache: 'no-store'});
    if (!r.ok) throw new Error();
    const text = await r.text();
    
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    return lines.slice(3).map(line => {
      const cols = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') {
          if (inQ && line[i+1]==='"') {cur += '"'; i++;}
          else inQ = !inQ;
        } else if (c === ',' && !inQ) {
          cols.push(cur.trim());
          cur = '';
        } else cur += c;
      }
      cols.push(cur.trim());
      return cols;
    }).filter(row => row.length > 0 && row[0].trim() !== '');
  } catch(e) {
    console.error("Erro ao carregar gid", gid);
    return [];
  }
}

// Ticker
async function carregarTicker() {
  const rows = await fetchCSV(GID_TICKER);
  const textos = rows
    .filter(r => String(r[1] || '').trim().toUpperCase() === 'SIM')
    .map(r => String(r[0] || '').trim())
    .filter(Boolean);

  const el = document.getElementById('ticker-text');
  if (textos.length && el) {
    el.textContent = [...textos, ...textos].join('   •   ');
    el.style.animation = 'none';
    void el.offsetHeight;
    el.style.animation = `ticker ${Math.max(90, textos.join('').length * 0.45)}s linear infinite`;
  }
}

// Inicialização
window.onload = () => {
  carregarTicker();
  // Adicione aqui as outras funções quando quiser (carregarAvisos, etc.)
  console.log("✅ Painel carregado com planilha conectada!");
};
</script>
