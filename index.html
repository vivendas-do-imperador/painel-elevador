<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivendas do Imperador — Painel de Avisos</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#0a0f1c;
  --azul2:#111827;
  --azul3:#1e2937;
  --acc:#c9a84c; /* Dourado premium */
  --br:#f1f5f9;
  --muted:#94a3b8;
  --verde:#34d399;
  --vermelho:#f87171;
}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--azul2);color:var(--br);font-family:'Barlow',sans-serif;}
#painel{width:100vw;height:100vh;display:flex;flex-direction:column;}

/* HEADER */
#header{height:12vh;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;background:var(--azul);border-bottom:4px solid var(--acc);position:relative;flex-shrink:0;}
#logo-wrap img{height:9vh;object-fit:contain;}
#header-center{position:absolute;left:50%;transform:translateX(-50%);text-align:center;}
#header-center h1{font-family:'Barlow Condensed',sans-serif;font-size:3.2vw;font-weight:900;color:var(--acc);letter-spacing:0.4vw;text-transform:uppercase;}
#header-center small{display:block;font-size:1.1vw;color:rgba(241,245,249,0.8);letter-spacing:0.25vw;}

/* resto do CSS mantido com ajustes de cores para tema Dark premium */
#painel-dir{background:#0f172a;}
/* ... (o resto do CSS original com pequenas melhorias de contraste) */
</style>
</head>
<body>
<div id="painel">
  <div id="header">
    <div id="logo-wrap">
      <img id="logo-img" src="https://i.imgur.com/SEU_LINK_DA_LOGO_IMPERADOR.png" alt="Vivendas do Imperador"> <!-- Substitua pelo link da logo -->
    </div>
    <div id="header-center">
      <h1>VIVENDAS DO IMPERADOR</h1>
      <small>Painel de Comunicação Interna</small>
    </div>
    <div id="relogio-wrap">
      <div id="relogio">00:00</div>
      <div id="data-label">—</div>
    </div>
  </div>

  <!-- O resto do corpo (aviso, clima, notícias, aniversários etc.) mantido igual, só com ajustes visuais -->
  <!-- ... -->
</div>

<script>
// Configurações principais (substitua os GIDs pelos da sua nova planilha)
const CSV_BASE = "https://docs.google.com/spreadsheets/d/SUA_NOVA_PLANILHA_ID/pub?output=csv";
const GID_AVISOS = "0";
const GID_TICKER = "123456789";
const GID_FRASES = "987654321";
const GID_ANIVERSARIOS = "111222333";
// etc.

document.getElementById('logo-img').src = 'https://seusite.com/logo-imperador.png'; // Logo principal
// ... resto do script mantido
</script>
</body>
</html>
