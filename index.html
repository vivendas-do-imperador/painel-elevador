<script>
// ==================== AJUSTES PRINCIPAIS ====================

// Atualize estes GIDs com os da sua planilha no Google Drive (pub como CSV)
const CSV_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7LIajehR7ILfrKuQvQBuwIT7c70FbSrm0FSJ9CXRiSlnawZJzSdCd73QpYpVWeuBDfIVFRNNvDqKN/pub?output=csv';

// Ajuste estes GIDs conforme sua planilha (verifique na URL da planilha publicada)
const GID_AVISOS = '1009110074';     // Guia de Avisos
const GID_TICKER = '798329129';      // Guia do Ticker (ajuste se necessário)
const GID_FRASES = '438009640';
const GID_ANIVERSARIOS = '';
const GID_CONTROLE = '1273927625';
const GID_PROGRAMACAO = '';

// Melhoria no parser de CSV para ser mais robusto com aspas e colunas ATIVO?
async function fetchCSV(gid){
  try{
    const url=CSV_BASE+'&gid='+gid+'&single=true';
    let text=null;
    // Tenta fetch direto
    try{const r=await fetch(url,{redirect:'follow',cache:'no-store'});if(r.ok)text=await r.text();}catch(e){}
    // Proxies CORS
    if(!text){try{const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url));if(r.ok)text=await r.text();}catch(e){}}
    if(!text){try{const r=await fetch('https://corsproxy.io/?'+encodeURIComponent(url));if(r.ok)text=await r.text();}catch(e){}}
    if(!text)return[];

    const lines=text.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length<2)return[];

    // Pula linhas de cabeçalho (primeiras 3 linhas típicas do Google Sheets)
    return lines.slice(3).map(line=>{
      // Parser CSV mais robusto
      const cols = [];
      let cur = '', inQ = false;
      for(let i=0; i<line.length; i++){
        const c = line[i];
        if(c === '"'){
          if(inQ && line[i+1] === '"'){ cur += '"'; i++; }
          else inQ = !inQ;
        } else if(c === ',' && !inQ){
          cols.push(cur.trim());
          cur = '';
        } else cur += c;
      }
      cols.push(cur.trim());
      return cols;
    }).filter(row => row.length > 0 && (row[0] || '').trim() !== '');
  }catch(e){return[];}
}

// Ticker melhorado: respeita coluna ATIVO?
async function carregarTicker(){
  const rows=await fetchCSV(GID_TICKER);
  // Filtra apenas linhas com ATIVO? = SIM (coluna 1)
  const textos=rows
    .filter(r => (r[1]||'').trim().toUpperCase() === 'SIM')
    .map(r=> (r[0]||'').trim())
    .filter(Boolean);
  
  if(!textos.length){
    console.warn('Nenhum texto ativo no ticker. Usando fallback.');
    return;
  }
  
  const el=document.getElementById('ticker-text');
  el.textContent=[...textos,...textos].join('   •   ');
  el.style.animation='none';el.offsetHeight;
  el.style.animation='ticker '+Math.max(90,textos.join('').length*0.45)+'s linear infinite';
}

</script>
